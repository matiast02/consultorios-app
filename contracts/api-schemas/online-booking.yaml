openapi: 3.0.3
info:
  title: Reservas online de turnos
  version: 1.0.0
  description: |
    El paciente pide un turno desde la web (`/reservar`) sin cuenta.

    Principios:
      - El turno entra como `Shift` PENDING con `source = ONLINE`; **recepción lo
        confirma** (o el paciente lo cancela desde su link). No hay OTP en v1: la
        confirmación telefónica/presencial de recepción es la verificación.
      - Minimización: el formulario no pide motivo ni texto libre. Solo nombre,
        apellido, DNI, teléfono, email (opcional), obra social (opcional) y el
        tipo de consulta (lista). Si el DNI ya existe, el turno se vincula al
        paciente existente **sin revelar ni modificar** sus datos; lo cargado
        queda en `OnlineBookingRequest` para que recepción verifique.
      - Disponibilidad pública: solo horarios libres (nunca nombres de otros
        pacientes). Respeta preferencias del médico, días bloqueados, turnos
        existentes, anticipación mínima y ventana máxima de días.
      - Anti-abuso: honeypot + tiempo mínimo en el formulario (`_hp`, `_elapsedMs`,
        como el formulario de contacto), rate limit por IP, máximo 3 reservas
        online pendientes por DNI, re-chequeo de conflicto dentro de la transacción.
      - Link de gestión `/reserva/<token>` (token aleatorio, solo hash en DB,
        vence con el turno) para ver el estado o cancelar. Si hay email y
        proveedor configurado, se envía por email; siempre se muestra en pantalla
        al terminar.
      - Solo profesionales con `acceptsOnlineBooking` y con el módulo habilitado
        en `ClinicSettings.onlineBookingEnabled`.

paths:
  /api/public/booking/config:
    get:
      summary: Configuración pública de la reserva online
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/PublicBookingConfig" }

  /api/public/booking/availability:
    get:
      summary: Horarios libres de un profesional en un rango de días
      parameters:
        - in: query
          name: medicId
          required: true
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date, description: "Default hoy (hora AR)" }
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
        - in: query
          name: consultationTypeId
          schema: { type: string, description: "Define la duración; si falta, la duración por defecto del médico" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      medicId: { type: string }
                      durationMinutes: { type: integer }
                      days:
                        type: array
                        items: { $ref: "#/components/schemas/PublicAvailabilityDay" }
        "404": { description: Profesional inexistente o no acepta reservas online }
        "429": { description: Rate limit }
        "503": { description: Reservas online deshabilitadas }

  /api/public/booking:
    post:
      summary: Crear una reserva online
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicBookingCreate" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/PublicBookingCreated" }
        "400": { description: Datos inválidos / privacidad no aceptada }
        "409": { description: "El horario ya no está disponible (code SLOT_TAKEN) o demasiadas reservas pendientes para ese DNI (code TOO_MANY_PENDING)" }
        "422": { description: "Horario fuera de la ventana permitida (code OUT_OF_WINDOW), fuera de la grilla del profesional (code NOT_A_SLOT) o profesional que no toma reservas online (code MEDIC_UNAVAILABLE)" }
        "429": { description: Rate limit por IP }
        "503": { description: Reservas online deshabilitadas }

  /api/public/booking/{token}:
    # Funciona aunque el módulo esté deshabilitado (quien ya reservó puede cancelar).
    get:
      summary: Estado de la reserva (link de gestión)
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/PublicBookingView" }
        "404": { description: Token inválido o vencido }
    post:
      summary: El paciente cancela la reserva
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [cancel] }
      responses:
        "200": { description: Reserva y turno cancelados }
        "404": { description: Token inválido o vencido }
        "409": { description: Ya no se puede cancelar (turno empezado, finalizado o ya cancelado) }

  /api/online-bookings:
    get:
      summary: Reservas online (recepción / admin)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING_CONFIRMATION, CONFIRMED, CANCELLED, EXPIRED] }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OnlineBookingStaffItem" }

  /api/online-bookings/{id}:
    patch:
      summary: Recepción confirma o rechaza una reserva
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [confirm, reject] }
      responses:
        "200": { description: OK; confirm → Shift CONFIRMED (confirmedVia STAFF); reject → Shift CANCELLED }
        "403": { description: Solo recepción o admin }
        "409": { description: Estado no admite la acción }

  /api/admin/clinic-settings:
    put:
      summary: (existente) acepta además la configuración de reservas online
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnlineBookingSettings" }

  /api/user/preferences-config:
    put:
      summary: (existente) acepta además `acceptsOnlineBooking` del profesional

components:
  schemas:
    PublicBookingConfig:
      type: object
      properties:
        enabled: { type: boolean }
        clinicName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        minAdvanceHours: { type: integer }
        maxDaysAhead: { type: integer }
        consultationTypes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              durationMinutes: { type: integer }
        specialties:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              color: { type: string, nullable: true }
              medics:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    shortName: { type: string, example: "Dra. López" }
                    slotDurationMinutes: { type: integer }
    PublicAvailabilityDay:
      type: object
      properties:
        date: { type: string, format: date }
        closed: { type: boolean }
        slots:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              time: { type: string, example: "10:30" }
    PublicBookingCreate:
      type: object
      required: [medicId, start, firstName, lastName, dni, phone, privacyAccepted]
      properties:
        medicId: { type: string }
        start: { type: string, format: date-time }
        consultationTypeId: { type: string, nullable: true }
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        dni: { type: string, pattern: "^[0-9]{6,10}$" }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email, nullable: true }
        healthInsurance: { type: string, maxLength: 80, nullable: true }
        privacyAccepted: { type: boolean, enum: [true] }
        _hp: { type: string, description: honeypot (debe venir vacío) }
        _elapsedMs: { type: integer, description: ms desde que se abrió el formulario (mínimo 3000) }
    PublicBookingCreated:
      type: object
      properties:
        requestId: { type: string }
        status: { type: string, enum: [PENDING_CONFIRMATION] }
        start: { type: string, format: date-time }
        medicShortName: { type: string }
        manageUrl: { type: string, description: "/reserva/<token>" }
        emailSent: { type: boolean }
        message: { type: string, description: "Texto para el paciente: qué sigue (recepción confirma)" }
    PublicBookingView:
      type: object
      properties:
        status: { type: string, enum: [PENDING_CONFIRMATION, CONFIRMED, CANCELLED, EXPIRED] }
        clinicName: { type: string, nullable: true }
        address: { type: string, nullable: true }
        patientFirstName: { type: string }
        start: { type: string, format: date-time }
        medicShortName: { type: string }
        consultationTypeName: { type: string, nullable: true }
        canCancel: { type: boolean }
    OnlineBookingStaffItem:
      type: object
      properties:
        id: { type: string }
        shiftId: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        start: { type: string, format: date-time }
        medicShortName: { type: string }
        medicColor: { type: string, nullable: true }
        consultationTypeName: { type: string, nullable: true }
        requester:
          type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
            dni: { type: string }
            phone: { type: string }
            email: { type: string, nullable: true }
            healthInsuranceText: { type: string, nullable: true }
        patientId: { type: string }
        matchedExisting: { type: boolean }
        patientDataMismatch: { type: boolean, description: "Existía el DNI pero nombre/apellido no coinciden: recepción debe verificar" }
    OnlineBookingSettings:
      type: object
      properties:
        onlineBookingEnabled: { type: boolean }
        onlineBookingMinAdvanceHours: { type: integer, minimum: 0, maximum: 168 }
        onlineBookingMaxDaysAhead: { type: integer, minimum: 1, maximum: 180 }
        onlineBookingNotes: { type: string, maxLength: 500, nullable: true }
