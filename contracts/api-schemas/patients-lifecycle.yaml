openapi: 3.0.3
info:
  title: Pacientes — ciclo de vida (alta, borrado, archivo, restauración)
  version: 1.0.0
  description: |
    Seguridad fase 1. Dos operaciones distintas para "eliminar" un paciente:

    - **purge** (borrado físico): solo si el paciente NO tiene asientos clínicos
      (evoluciones, recetas, órdenes, planes, versiones del ledger) y no tiene
      turnos no cancelados con otros profesionales (médico) / ningún turno no
      cancelado (secretaria, admin). Lo pueden pedir admin, secretaria o el
      médico que dio de alta al paciente (`createdById`).
    - **archive** (baja lógica: `deletedAt`, `deletedById`): la historia clínica
      se conserva (10 años). Médico creador: solo si no hay asientos ni turnos
      no cancelados de otros profesionales. Admin: siempre (devuelve `warnings`
      con los profesionales involucrados). Secretaria: nunca. Un turno FUTURO no
      cancelado con otro profesional bloquea a todos.

    Toda operación queda auditada (`DELETE` sobre `patient`, `details: { mode }`).
    La restauración es solo para admin (`UPDATE`, `details: { restored: true }`).

servers:
  - url: /api

tags:
  - name: patients

paths:
  /patients:
    post:
      tags: [patients]
      summary: Alta de paciente (setea createdById con el usuario de la sesión)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Mismo body que antes (createPatientSchema). createdById NO se acepta del cliente.
      responses:
        "201":
          description: Creado
        "400":
          description: Datos inválidos
        "401":
          description: No autorizado
        "409":
          description: DNI duplicado (activo o archivado)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DuplicateError"
                  - $ref: "#/components/schemas/ArchivedDuplicateError"

  /patients/{id}:
    put:
      tags: [patients]
      summary: Edición (sin cambios de contrato salvo los códigos de 409 por DNI)
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "409":
          description: DNI duplicado (activo o archivado)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DuplicateError"
                  - $ref: "#/components/schemas/ArchivedDuplicateError"
    delete:
      tags: [patients]
      summary: Borrar (purge) o archivar (archive) un paciente activo
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [purge, archive]
            default: archive
      responses:
        "200":
          description: Operación realizada
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [id, mode]
                    properties:
                      id: { type: string }
                      mode: { type: string, enum: [purge, archive] }
                      warnings:
                        type: array
                        description: Solo en archive. Mensajes listos para mostrar (profesionales involucrados, turnos propios que siguen en agenda).
                        items: { type: string }
                      otherProfessionals:
                        type: array
                        description: Solo en archive.
                        items: { $ref: "#/components/schemas/ProfessionalRef" }
        "400":
          description: mode inválido
        "401":
          description: No autorizado
        "403":
          description: El rol no puede realizar esa operación (secretaria archivando, médico que no dio de alta al paciente, rol desconocido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [false] }
                  code: { type: string, enum: [FORBIDDEN] }
                  error: { type: string }
        "404":
          description: Paciente no encontrado (o ya archivado)
        "409":
          description: Operación bloqueada por historia clínica / turnos con otros profesionales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionBlockedError"

  /patients/{id}/restore:
    post:
      tags: [patients]
      summary: Restaurar un paciente archivado (solo admin)
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Restaurado (devuelve el paciente con `os`)
        "401":
          description: No autorizado
        "403":
          description: Solo admin
        "404":
          description: Paciente no encontrado
        "409":
          description: El paciente no está archivado (NOT_ARCHIVED) o su DNI choca con un paciente activo (DUPLICATE)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [false] }
                  code: { type: string, enum: [NOT_ARCHIVED, DUPLICATE] }
                  error: { type: string }

components:
  parameters:
    PatientId:
      in: path
      name: id
      required: true
      schema: { type: string }

  schemas:
    ProfessionalRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DuplicateError:
      type: object
      required: [success, code, error]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, enum: [DUPLICATE] }
        error: { type: string, example: "Ya existe un paciente con ese DNI" }

    ArchivedDuplicateError:
      type: object
      required: [success, code, error, archivedPatientId]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, enum: [ARCHIVED_DUPLICATE] }
        archivedPatientId: { type: string }
        error: { type: string, example: "Ya existe un paciente archivado con ese DNI" }

    DeletionBlockedError:
      type: object
      required: [success, code, error, blockers]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, enum: [PURGE_BLOCKED, ARCHIVE_BLOCKED] }
        error: { type: string, description: Motivo en español, listo para mostrar }
        blockers:
          type: object
          required: [clinicalEntries, otherProfessionals, futureShiftsWithOthers, canArchive]
          properties:
            clinicalEntries:
              type: integer
              description: Asientos clínicos distintos (evoluciones, recetas, órdenes, planes, ficha) de cualquier autor
            otherProfessionals:
              type: array
              description: |
                Profesionales distintos del solicitante con asientos o turnos no cancelados.
                Para roles no clínicos (secretaria) solo incluye los que surgen de turnos
                (no se revela la autoría de asientos clínicos).
              items: { $ref: "#/components/schemas/ProfessionalRef" }
            futureShiftsWithOthers:
              type: integer
            canArchive:
              type: boolean
              description: Si el solicitante podría archivar al paciente en su estado actual
