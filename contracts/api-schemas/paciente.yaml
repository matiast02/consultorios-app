openapi: 3.0.3
info:
  title: Paciente Detail — API Contract
  version: 1.0.0
  description: |
    Endpoints used by the redesigned /dashboard/pacientes/[id] page.
    Only the *delta* from the existing API is documented here — fields and routes
    that did not change keep their previous contract.

servers:
  - url: /api

tags:
  - name: patients
  - name: clinical-record
  - name: prescriptions

paths:
  /patients/{id}:
    patch:
      tags: [patients]
      summary: Update patient (now includes emergency contact)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientPatch"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Patient"

  /patients/{id}/clinical-record:
    put:
      tags: [clinical-record]
      summary: Upsert clinical record (now includes height/weight/habits/structured allergies)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicalRecordUpsert"
      responses:
        "200":
          description: Saved clinical record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClinicalRecord"

  /prescriptions:
    post:
      tags: [prescriptions]
      summary: Create prescription (now includes durationDays for vigencia calc)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Prescription"

components:
  schemas:
    PatientPatch:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dni: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        telephone: { type: string, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        sex: { type: string, nullable: true, enum: [M, F, X, null] }
        address: { type: string, nullable: true }
        country: { type: string, nullable: true }
        province: { type: string, nullable: true }
        osId: { type: string, nullable: true }
        osNumber: { type: string, nullable: true }
        # NEW
        emergencyContactName: { type: string, nullable: true, maxLength: 120 }
        emergencyContactPhone: { type: string, nullable: true, maxLength: 40 }

    Patient:
      type: object
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dni: { type: string, nullable: true }
        email: { type: string, nullable: true }
        telephone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        country: { type: string, nullable: true }
        province: { type: string, nullable: true }
        birthDate: { type: string, nullable: true, format: date-time }
        sex: { type: string, nullable: true }
        osId: { type: string, nullable: true }
        osNumber: { type: string, nullable: true }
        emergencyContactName: { type: string, nullable: true }
        emergencyContactPhone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AllergySeverity:
      type: string
      enum: [alta, media, baja]

    StructuredAllergy:
      type: object
      required: [nombre, severidad]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80 }
        severidad: { $ref: "#/components/schemas/AllergySeverity" }
        nota: { type: string, maxLength: 240, nullable: true }

    ClinicalRecordUpsert:
      type: object
      additionalProperties: false
      properties:
        bloodType: { type: string, nullable: true, enum: ["A+","A-","B+","B-","AB+","AB-","O+","O-",""] }
        allergies:
          description: Free-text allergies (legacy fallback)
          type: string
          nullable: true
        personalHistory: { type: string, nullable: true }
        familyHistory: { type: string, nullable: true }
        currentMedication: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        customFields:
          description: Profession-specific JSON blob (odontogram, anthropometric…)
          type: string
          nullable: true
        # NEW
        heightCm:
          type: integer
          nullable: true
          minimum: 30
          maximum: 260
        weightKg:
          type: number
          nullable: true
          minimum: 1
          maximum: 400
        habitsTobacco: { type: string, nullable: true, maxLength: 240 }
        habitsAlcohol: { type: string, nullable: true, maxLength: 240 }
        habitsActivity: { type: string, nullable: true, maxLength: 240 }
        habitsDiet: { type: string, nullable: true, maxLength: 240 }
        structuredAllergies:
          description: Optional richer allergy list; when provided supersedes the `allergies` free-text in the UI.
          type: array
          items: { $ref: "#/components/schemas/StructuredAllergy" }
          nullable: true

    ClinicalRecord:
      type: object
      properties:
        id: { type: string }
        patientId: { type: string }
        bloodType: { type: string, nullable: true }
        allergies: { type: string, nullable: true }
        personalHistory: { type: string, nullable: true }
        familyHistory: { type: string, nullable: true }
        currentMedication: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        customFields: { type: string, nullable: true }
        heightCm: { type: integer, nullable: true }
        weightKg: { type: number, nullable: true }
        habitsTobacco: { type: string, nullable: true }
        habitsAlcohol: { type: string, nullable: true }
        habitsActivity: { type: string, nullable: true }
        habitsDiet: { type: string, nullable: true }
        structuredAllergies:
          type: array
          items: { $ref: "#/components/schemas/StructuredAllergy" }
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PrescriptionItem:
      type: object
      required: [medication]
      properties:
        medication: { type: string }
        dose: { type: string, nullable: true }
        form: { type: string, nullable: true }
        quantity: { type: integer, nullable: true }
        instructions: { type: string, nullable: true }

    PrescriptionCreate:
      type: object
      required: [patientId, items]
      additionalProperties: false
      properties:
        patientId: { type: string }
        userId: { type: string, nullable: true }
        shiftId: { type: string, nullable: true }
        diagnosis: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PrescriptionItem" }
        # NEW
        durationDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: Days of validity from createdAt; UI computes "vence el ..." and "vigente|vencida".

    Prescription:
      type: object
      properties:
        id: { type: string }
        patientId: { type: string }
        userId: { type: string }
        shiftId: { type: string, nullable: true }
        items: { type: string, description: "JSON-stringified PrescriptionItem[]" }
        diagnosis: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        durationDays: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
