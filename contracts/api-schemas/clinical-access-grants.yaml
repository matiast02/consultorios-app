openapi: 3.0.3
info:
  title: Concesiones de acceso a la historia clínica entre médicos
  version: 1.0.0
  description: |
    Fase 3 de seguridad. Ley 26.529 art. 19 inc. d (otro profesional con
    autorización del paciente) y Ley 25.326 art. 11 (cesión de datos sensibles
    con consentimiento).

    **Política**

    - Un médico SIN relación clínica con el paciente (no tiene asientos propios:
      evoluciones, recetas, órdenes o planes) puede **solicitar acceso**
      (`PENDING`) indicando alcance (`FULL` o `PARTIAL` con secciones y/o
      asientos concretos) y motivo.
    - La deciden los **médicos tratantes** del paciente (tienen asientos con él)
      o el **admin**. Nunca el propio beneficiario.
      - Aprobar exige registrar el consentimiento del paciente (`consentType`
        obligatorio, `consentEvidence` libre, `consentAt`) y fija la vigencia:
        `expiresAt = ahora + days` (default 30, máximo 180) → `ACTIVE`.
      - Rechazar exige `decisionNote` → `REJECTED`.
    - Revocar una `ACTIVE`: admin, el tratante que la aprobó o cualquier
      tratante → `REVOKED`. El beneficiario puede cancelar la suya (`cancel`):
      `PENDING → REJECTED`, `ACTIVE → REVOKED`.
    - Vigencia: `status = ACTIVE` y `startsAt ≤ ahora < expiresAt`. Una ACTIVE
      vencida no da acceso aunque el cron (`pnpm db:purge-expired`) todavía no la
      haya marcado `EXPIRED`. Las concesiones nunca se borran (trazabilidad).
    - Con una concesión vigente el beneficiario **lee** (nunca edita, anula ni
      crea a nombre de otro) dentro del alcance:
      - `FULL`: ficha completa + todos los asientos del paciente.
      - `PARTIAL`: solo las secciones listadas y/o los asientos de `entryIds`.

        | sección        | qué habilita                                                   |
        |----------------|----------------------------------------------------------------|
        | antecedentes   | ficha: personalHistory, familyHistory, habits* (tabaco, alcohol, actividad, dieta) |
        | alergias       | ficha: allergies, structuredAllergies                          |
        | medicacion     | ficha: currentMedication                                       |
        | evoluciones    | todas las Evolution del paciente                               |
        | recetas        | todas las Prescription                                         |
        | estudios       | todas las StudyOrder                                           |
        | planes         | todos los MealPlan                                             |

      Grupo sanguíneo, antropometría, notas, campos por profesión, odontograma y
      genograma solo se ven con `FULL` (o siendo tratante / admin). Las alergias
      estructuradas se ven siempre (dato de seguridad del paciente).

    **Auditoría**: solicitar / rechazar / cancelar una PENDING → `REQUEST_ACCESS`;
    aprobar / revocar → `GRANT_ACCESS` (recurso `clinical_access_grant`). Cada
    lectura clínica bajo concesión → `VIEW_SENSITIVE` con `details.grantId`.

    `reason`, `consentEvidence` y `decisionNote` se guardan cifrados (AES-256-GCM)
    y nunca van al audit log.

servers:
  - url: /api

tags:
  - name: clinical-access-grants

paths:
  /clinical-access-grants:
    get:
      tags: [clinical-access-grants]
      summary: Listar concesiones / solicitudes visibles para el usuario
      description: |
        - Médico: `received` = las suyas (es el beneficiario); `to-decide` = las
          de pacientes de los que es tratante y no son suyas. Sin `box`: unión
          de ambas.
        - Admin: todas (`received` no aplica: el admin no solicita).
        - Secretaria / otros roles: 403.

        Con `box=to-decide` y sin `status`, se filtra `PENDING` por defecto.
        `status` se evalúa sobre el estado **efectivo** (`ACTIVE` = vigente;
        `EXPIRED` incluye las ACTIVE vencidas).
      parameters:
        - in: query
          name: patientId
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/GrantStatus" }
        - in: query
          name: box
          schema:
            type: string
            enum: [received, to-decide]
      responses:
        "200":
          description: OK (máximo 200, más recientes primero)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ClinicalAccessGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [clinical-access-grants]
      summary: Solicitar acceso a la historia clínica de un paciente (solo médicos)
      description: |
        El médico no puede tener relación clínica con el paciente ni otra
        solicitud `PENDING` o concesión vigente para él. Los `entryIds` deben
        pertenecer al paciente. Audita `REQUEST_ACCESS`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGrantRequest" }
      responses:
        "201":
          description: Solicitud creada (PENDING)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/ClinicalAccessGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Solo médicos pueden solicitar acceso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Paciente no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Ya tiene relación clínica, o ya existe una solicitud pendiente / concesión vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /clinical-access-grants/{id}:
    patch:
      tags: [clinical-access-grants]
      summary: Aprobar, rechazar, revocar o cancelar
      description: |
        | action  | estado requerido | quién                                  | resultado          |
        |---------|------------------|----------------------------------------|--------------------|
        | approve | PENDING          | admin o tratante (no el beneficiario)  | ACTIVE             |
        | reject  | PENDING          | admin o tratante (no el beneficiario)  | REJECTED           |
        | revoke  | ACTIVE           | admin, tratante o quien la aprobó      | REVOKED            |
        | cancel  | PENDING / ACTIVE | solo el beneficiario                   | REJECTED / REVOKED |

        404 si el usuario no puede ver la concesión (no es beneficiario,
        tratante ni admin); 403 si la ve pero la acción no le corresponde;
        409 si el estado no lo permite (incluye decisiones concurrentes).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantAction" }
      responses:
        "200":
          description: Concesión actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/ClinicalAccessGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Concesión no encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: El estado actual no permite la acción
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /patients/{id}/clinical-access:
    get:
      tags: [clinical-access-grants]
      summary: Estado de acceso a la HC del paciente para el usuario actual
      description: |
        Alimenta la página del paciente: banner de "sin acceso" / "solicitud
        pendiente" / "acceso concedido", secciones visibles de la ficha y si el
        usuario puede decidir solicitudes (panel "Accesos a la HC").
        Solo roles clínicos (médico, admin); secretaria → 403.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/ClinicalAccessStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Paciente no encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        details: { type: object, description: "Errores de validación (zod flatten)" }

    GrantStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, REVOKED, EXPIRED]

    GrantScope:
      type: string
      enum: [FULL, PARTIAL]

    GrantSection:
      type: string
      enum: [antecedentes, alergias, medicacion, evoluciones, recetas, estudios, planes]

    RecordSection:
      type: string
      description: Secciones de la ficha (subconjunto de GrantSection)
      enum: [antecedentes, alergias, medicacion]

    ConsentType:
      type: string
      enum: [WRITTEN, VERBAL_RECORDED, DIGITAL_SIGNATURE]

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }

    ClinicalAccessGrant:
      type: object
      required: [id, patientId, grantedToUserId, status, isActive, scope, sections, entryIds, reason, createdAt, permissions]
      properties:
        id: { type: string }
        patientId: { type: string }
        patient:
          type: object
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
        grantedToUserId: { type: string }
        grantedTo: { $ref: "#/components/schemas/UserRef" }
        requestedById: { type: string }
        decidedById: { type: string, nullable: true }
        decidedBy:
          allOf: [{ $ref: "#/components/schemas/UserRef" }]
          nullable: true
        revokedById: { type: string, nullable: true }
        revokedBy:
          allOf: [{ $ref: "#/components/schemas/UserRef" }]
          nullable: true
        status:
          allOf: [{ $ref: "#/components/schemas/GrantStatus" }]
          description: Estado efectivo (una ACTIVE vencida se informa EXPIRED)
        isActive:
          type: boolean
          description: Vigente ahora (ACTIVE y dentro de startsAt / expiresAt)
        scope: { $ref: "#/components/schemas/GrantScope" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/GrantSection" }
        entryIds:
          type: array
          items: { type: string }
        reason: { type: string, description: "Motivo clínico (cifrado en reposo)" }
        consentType:
          allOf: [{ $ref: "#/components/schemas/ConsentType" }]
          nullable: true
        consentEvidence: { type: string, nullable: true }
        consentAt: { type: string, format: date-time, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionNote: { type: string, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        permissions:
          type: object
          description: Acciones que el usuario actual puede ejecutar sobre esta concesión
          required: [approve, reject, revoke, cancel]
          properties:
            approve: { type: boolean }
            reject: { type: boolean }
            revoke: { type: boolean }
            cancel: { type: boolean }

    CreateGrantRequest:
      type: object
      required: [patientId, scope, reason]
      properties:
        patientId: { type: string }
        scope: { $ref: "#/components/schemas/GrantScope" }
        sections:
          type: array
          description: Obligatorio (o entryIds) si scope = PARTIAL; se ignora con FULL
          items: { $ref: "#/components/schemas/GrantSection" }
        entryIds:
          type: array
          maxItems: 100
          description: Ids de asientos del paciente (evolución, receta, orden o plan); se ignora con FULL
          items: { type: string }
        reason:
          type: string
          minLength: 10
          maxLength: 1000

    GrantAction:
      oneOf:
        - type: object
          required: [action, consentType]
          properties:
            action: { type: string, enum: [approve] }
            consentType: { $ref: "#/components/schemas/ConsentType" }
            consentEvidence: { type: string, maxLength: 2000, nullable: true }
            consentAt:
              type: string
              format: date-time
              description: Cuándo se obtuvo el consentimiento (default ahora; no puede ser futuro)
            days:
              type: integer
              minimum: 1
              maximum: 180
              default: 30
        - type: object
          required: [action, decisionNote]
          properties:
            action: { type: string, enum: [reject] }
            decisionNote: { type: string, minLength: 3, maxLength: 1000 }
        - type: object
          required: [action]
          properties:
            action: { type: string, enum: [revoke] }
            decisionNote: { type: string, maxLength: 1000 }
        - type: object
          required: [action]
          properties:
            action: { type: string, enum: [cancel] }
      discriminator:
        propertyName: action

    ActiveGrantSummary:
      type: object
      required: [id, scope, sections, entryIds, startsAt, expiresAt]
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/GrantScope" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/GrantSection" }
        entryIds:
          type: array
          items: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    ClinicalAccessStatus:
      type: object
      required: [isAdmin, hasRelationship, canDecide, canRequest, record, activeGrant, pendingRequest, pendingToDecide]
      properties:
        isAdmin: { type: boolean }
        hasRelationship:
          type: boolean
          description: Médico tratante (tiene asientos propios con el paciente) o admin. Habilita editar la ficha.
        canDecide:
          type: boolean
          description: Puede aprobar / rechazar / revocar concesiones de este paciente
        canRequest:
          type: boolean
          description: Médico sin relación, sin solicitud pendiente ni concesión vigente
        record:
          type: object
          required: [full, sections]
          properties:
            full:
              type: boolean
              description: Ve la ficha completa (tratante, admin o concesión FULL)
            sections:
              type: array
              items: { $ref: "#/components/schemas/RecordSection" }
        activeGrant:
          allOf: [{ $ref: "#/components/schemas/ActiveGrantSummary" }]
          nullable: true
        pendingRequest:
          type: object
          nullable: true
          properties:
            id: { type: string }
            scope: { $ref: "#/components/schemas/GrantScope" }
            sections:
              type: array
              items: { $ref: "#/components/schemas/GrantSection" }
            createdAt: { type: string, format: date-time }
        pendingToDecide:
          type: integer
          description: Solicitudes PENDING de este paciente que el usuario puede decidir
