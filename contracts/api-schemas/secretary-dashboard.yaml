openapi: 3.0.3
info:
  title: Secretary / Reception Dashboard API
  version: 1.0.0
  description: |
    Aggregated read-model and operational endpoints for the secretary (reception) dashboard.
    Powers waiting-room, next-to-call, reminders, today's gaps and the multi-mode day agenda.

    Backed by:
      - New fields on Shift: arrivedAt, consultationStartedAt
      - New model WalkInArrival (un-scheduled patient who arrived)
      - New model ShiftReminder (persistent reminder with status)
      - New field User.defaultRoom (default consulting room)
      - New field Specialization.color (hex color used for medic dot)

paths:
  /api/dashboard/secretary:
    get:
      summary: Get aggregated dashboard data for the authenticated secretary
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/SecretaryDashboardData"
        "401": { description: Unauthorized }
        "403": { description: Forbidden — only secretary/admin can access }

  /api/shifts/{id}/arrival:
    post:
      summary: Mark a scheduled shift as arrived (paciente entró a sala)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated shift
        "404": { description: Shift not found }
    delete:
      summary: Undo arrival (clears arrivedAt)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/shifts/{id}/start-consultation:
    post:
      summary: Move a patient from waiting room into consultation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: OK }

  /api/walk-ins:
    post:
      summary: Register a walk-in arrival (patient with or without record)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patientId: { type: string, nullable: true }
                firstName: { type: string }
                lastName: { type: string }
                telephone: { type: string, nullable: true }
                note: { type: string, nullable: true }
      responses:
        "200":
          description: Created walk-in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WalkInArrival"

  /api/walk-ins/{id}:
    patch:
      summary: Update walk-in (mark left, attach shift)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leftAt: { type: string, format: date-time, nullable: true }
                assignedShiftId: { type: string, nullable: true }
                note: { type: string, nullable: true }
      responses:
        "200": { description: OK }

  /api/shifts/reminders/send:
    post:
      summary: Mark all PENDING reminders for a target date as SENT (stub for real email/sms)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date, description: "YYYY-MM-DD; defaults to tomorrow" }
      responses:
        "200":
          description: Sent count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: integer }

components:
  schemas:
    SecretaryDashboardData:
      type: object
      required: [header, stats, salaDeEspera, proximoALlamar, recordatorios, huecosHoy, agenda]
      properties:
        header:
          $ref: "#/components/schemas/HeaderData"
        stats:
          $ref: "#/components/schemas/StatsData"
        salaDeEspera:
          type: array
          items:
            $ref: "#/components/schemas/WaitingRoomItem"
        proximoALlamar:
          oneOf:
            - $ref: "#/components/schemas/NextToCall"
            - type: "null"
        recordatorios:
          $ref: "#/components/schemas/RemindersData"
        huecosHoy:
          type: array
          items:
            $ref: "#/components/schemas/MedicSlotsGroup"
        agenda:
          $ref: "#/components/schemas/AgendaData"

    HeaderData:
      type: object
      required: [secretaryName, now, activeProfessionalsCount]
      properties:
        secretaryName: { type: string }
        now: { type: string, format: date-time, description: "Server-side current timestamp ISO" }
        activeProfessionalsCount: { type: integer }

    StatsData:
      type: object
      required: [enSalaDeEspera, enConsulta, esperandoMas15, huecosHoy]
      properties:
        enSalaDeEspera: { type: integer }
        enConsulta: { type: integer }
        esperandoMas15: { type: integer }
        huecosHoy: { type: integer }

    WaitingRoomItem:
      type: object
      required: [id, kind, arrivedAt, minutesWaiting, patient]
      properties:
        id: { type: string }
        kind: { type: string, enum: [scheduled, walkin] }
        arrivedAt: { type: string, format: date-time }
        minutesWaiting: { type: integer }
        isNext: { type: boolean, description: "True when this is the next patient to be called" }
        note: { type: string, nullable: true }
        patient:
          type: object
          properties:
            id: { type: string, nullable: true }
            firstName: { type: string }
            lastName: { type: string }
            telephone: { type: string, nullable: true }
            osShort: { type: string, nullable: true }
        shift:
          type: object
          nullable: true
          properties:
            id: { type: string }
            start: { type: string, format: date-time }
            durationMinutes: { type: integer }
            medicId: { type: string }
            medicShortName: { type: string, description: "e.g. 'Dr. Romero'" }
            medicColor: { type: string, nullable: true, description: "hex color of medic's specialization" }
            consultationTypeName: { type: string, nullable: true }

    NextToCall:
      type: object
      required: [waitingRoomId, patient, shiftStart, minutesWaiting]
      properties:
        waitingRoomId: { type: string, description: "Either the shift.id or walk-in id" }
        kind: { type: string, enum: [scheduled, walkin] }
        patient:
          type: object
          properties:
            firstName: { type: string }
            lastName: { type: string }
        medicShortName: { type: string }
        medicColor: { type: string, nullable: true }
        room: { type: string, nullable: true, description: "Consultorio (e.g. C1)" }
        shiftStart: { type: string, format: date-time, nullable: true }
        minutesWaiting: { type: integer }

    RemindersData:
      type: object
      required: [context, total, pending, sent, items]
      properties:
        context: { type: string, enum: [today, tomorrow] }
        total: { type: integer }
        pending: { type: integer }
        sent: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReminderItem"

    ReminderItem:
      type: object
      required: [id, shiftId, time, patientShortName, medicShortName, status]
      properties:
        id: { type: string }
        shiftId: { type: string }
        time: { type: string, description: "HH:mm" }
        patientShortName: { type: string, description: "e.g. 'Rodríguez, Lucas'" }
        medicShortName: { type: string }
        medicColor: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, SENT, FAILED] }

    MedicSlotsGroup:
      type: object
      required: [medicId, medicShortName, dotColor, count, slots]
      properties:
        medicId: { type: string }
        medicShortName: { type: string }
        dotColor: { type: string, nullable: true }
        count: { type: integer, description: "Number of free slots" }
        slots:
          type: array
          items:
            type: object
            properties:
              time: { type: string, description: "HH:mm" }
              durationMinutes: { type: integer }

    AgendaData:
      type: object
      required: [autoMode, profesionales, totalShifts]
      properties:
        autoMode:
          type: string
          enum: [columns-detailed, columns-compact, rails]
          description: |
            Recommended mode based on number of active medics:
            ≤2 → columns-detailed, 3-5 → columns-compact, >5 → rails.
        profesionales:
          type: array
          items:
            $ref: "#/components/schemas/AgendaProfessional"
        totalShifts: { type: integer }

    AgendaProfessional:
      type: object
      required: [id, shortName, dotColor, isPinned, turnSegments, shifts]
      properties:
        id: { type: string }
        shortName: { type: string, description: "e.g. 'Dr. Gervilla'" }
        especialidad: { type: string, nullable: true }
        room: { type: string, nullable: true }
        dotColor: { type: string, nullable: true }
        isPinned: { type: boolean }
        turnSegments:
          type: array
          items: { type: string, enum: [AM, PM] }
          description: "Which day-halves this professional works"
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/AgendaShift"

    AgendaShift:
      type: object
      required: [id, start, end, status, patientShortName]
      properties:
        id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, CONFIRMED, ABSENT, FINISHED, CANCELLED] }
        patientShortName: { type: string, description: "e.g. 'Pérez, J.'" }
        consultationTypeName: { type: string, nullable: true }
        isWalkIn: { type: boolean }

    WalkInArrival:
      type: object
      properties:
        id: { type: string }
        patientId: { type: string, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        telephone: { type: string, nullable: true }
        note: { type: string, nullable: true }
        arrivedAt: { type: string, format: date-time }
        leftAt: { type: string, format: date-time, nullable: true }
        assignedShiftId: { type: string, nullable: true }
