openapi: 3.0.3
info:
  title: Copia de la historia clínica para el paciente
  version: 1.0.0
  description: |
    Ley 26.529 art. 14: el paciente tiene derecho a una copia de su historia
    clínica, autenticada por autoridad competente de la institución, dentro de
    las 48 horas de solicitada. Art. 19: pueden pedirla el paciente y su
    representante legal; el cónyuge/conviviente y los herederos forzosos (con
    autorización o en caso de fallecimiento); médicos y otros profesionales con
    autorización del paciente; y la autoridad judicial.

    El paciente no es usuario del sistema: el personal registra la solicitud y
    la entrega.

    **Permisos**
    - Registrar / listar / cancelar: `admin`, `medic`, `secretary`.
    - Generar y entregar el PDF (`deliver`): solo `admin` y `medic` (cualquier
      médico, sin necesidad de relación con el paciente: la copia es del
      paciente y es completa). La secretaria nunca ve el contenido clínico.
    - Pendientes globales (`GET /hc-copy-requests`): solo `admin`.
    - Se admiten pacientes archivados (`deletedAt`): la HC se conserva y los
      herederos pueden pedirla tras el fallecimiento.

    **Contenido de la copia** (completa, única por establecimiento): datos
    personales, ficha clínica (todos los campos), todas las evoluciones,
    recetas, órdenes de estudio y planes alimentarios de TODOS los
    profesionales en orden cronológico con autor y fecha; los asientos anulados
    se incluyen marcados "ANULADO" con fecha, autor y motivo. Cada asiento
    lleva el `contentHash` de su última versión en el ledger clínico. Al final,
    las concesiones de acceso a la HC (si existen).

    **documentHash**: sha256 (hex) del JSON canónico (claves ordenadas) del
    contenido clínico de la copia. No incluye metadatos de emisión (fecha,
    emisor, solicitud), así dos emisiones con el mismo contenido tienen el mismo
    hash y cualquiera puede verificar una copia regenerándola.

    **Auditoría**
    - Registrar: `CREATE` sobre `hc_copy_request`.
    - Cancelar: `UPDATE` sobre `hc_copy_request` (`details.status = CANCELLED`).
    - Entregar / volver a descargar: `EXPORT_HC` sobre `hc_copy_request`
      (`details: { patientId, requesterType, documentHash, reissue }`) +
      `VIEW_SENSITIVE` sobre `clinical_record`.

servers:
  - url: /api

tags:
  - name: hc-copy-requests

paths:
  /patients/{id}/hc-copy-requests:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [hc-copy-requests]
      summary: Solicitudes de copia de HC del paciente (más recientes primero)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HcCopyRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [hc-copy-requests]
      summary: Registrar una solicitud de copia (dueAt = ahora + 48 h)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHcCopyRequest" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/HcCopyRequest" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /patients/{id}/hc-copy-requests/{requestId}/deliver:
    parameters:
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [hc-copy-requests]
      summary: Generar el PDF y marcar la solicitud como entregada (admin / médico)
      description: |
        - PENDING → genera el PDF, guarda `documentHash`, `deliveredAt`,
          `deliveredById`, `deliveryNote` y pasa a DELIVERED.
        - DELIVERED → vuelve a generar y descargar el PDF con el contenido
          actual. Los datos de la entrega original (fecha, emisor, nota, hash)
          NO se modifican; la reemisión queda en la auditoría con su hash.
        - CANCELLED → 409.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryNote:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Ej. "entregada en mano", "enviada por email". Se ignora al volver a descargar.
      responses:
        "200":
          description: PDF de la copia
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename="HC-<apellido>-<AAAA-MM-DD>.pdf"
            X-Document-Hash:
              schema: { type: string }
              description: sha256 del contenido canónico de esta emisión
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La solicitud está cancelada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /patients/{id}/hc-copy-requests/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PatientId"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [hc-copy-requests]
      summary: Cancelar una solicitud PENDING
      responses:
        "200":
          description: Cancelada
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data: { $ref: "#/components/schemas/HcCopyRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La solicitud no está pendiente (ya entregada o cancelada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }

  /hc-copy-requests:
    get:
      tags: [hc-copy-requests]
      summary: Solicitudes de todos los pacientes por estado (solo admin; dashboard)
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [PENDING, DELIVERED, CANCELLED]
            default: PENDING
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK. PENDING ordenadas por dueAt ascendente; el resto por requestedAt descendente. Sin notas cifradas ni contenido clínico.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [items, count, overdue]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/HcCopyRequestSummary" }
                      count: { type: integer, description: Total con ese estado }
                      overdue: { type: integer, description: PENDING con dueAt vencido (0 si status != PENDING) }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  parameters:
    PatientId:
      in: path
      name: id
      required: true
      schema: { type: string }
    RequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: El rol no puede realizar la operación
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Paciente o solicitud inexistente (o la solicitud no es de ese paciente)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Error del servidor
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, example: FORBIDDEN }
        error: { type: string }
        details: { type: object, description: Errores de validación de Zod (flatten) }

    HcCopyRequesterType:
      type: string
      enum: [PATIENT, LEGAL_REPRESENTATIVE, HEIR, EXTERNAL_PROFESSIONAL, JUDICIAL]
      description: |
        PATIENT: el propio paciente · LEGAL_REPRESENTATIVE: representante legal ·
        HEIR: cónyuge, conviviente o heredero forzoso · EXTERNAL_PROFESSIONAL:
        profesional de otra institución con autorización del paciente ·
        JUDICIAL: orden judicial.

    HcCopyStatus:
      type: string
      enum: [PENDING, DELIVERED, CANCELLED]

    CreateHcCopyRequest:
      type: object
      required: [requesterType, requesterName]
      description: authorizationNote es obligatorio si requesterType != PATIENT.
      properties:
        requesterType: { $ref: "#/components/schemas/HcCopyRequesterType" }
        requesterName: { type: string, minLength: 2, maxLength: 120 }
        requesterDni: { type: string, maxLength: 20, nullable: true }
        authorizationNote:
          type: string
          maxLength: 1000
          nullable: true
          description: Cómo se acreditó el vínculo o la autorización (cifrado en reposo)
        reason: { type: string, maxLength: 1000, nullable: true, description: Motivo (cifrado en reposo) }

    UserRef:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    HcCopyRequest:
      type: object
      required:
        [id, patientId, requesterType, requesterName, status, requestedAt, dueAt, overdue, registeredBy]
      properties:
        id: { type: string }
        patientId: { type: string }
        requesterType: { $ref: "#/components/schemas/HcCopyRequesterType" }
        requesterName: { type: string }
        requesterDni: { type: string, nullable: true }
        authorizationNote: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/HcCopyStatus" }
        requestedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, description: requestedAt + 48 h }
        overdue: { type: boolean, description: PENDING y dueAt < ahora }
        registeredBy: { $ref: "#/components/schemas/UserRef" }
        deliveredAt: { type: string, format: date-time, nullable: true }
        deliveredBy: { $ref: "#/components/schemas/UserRef" }
        deliveryNote: { type: string, nullable: true }
        documentHash: { type: string, nullable: true, description: sha256 del contenido canónico entregado }

    HcCopyRequestSummary:
      type: object
      required: [id, patient, requesterType, requesterName, status, requestedAt, dueAt, overdue]
      properties:
        id: { type: string }
        patient:
          type: object
          required: [id, firstName, lastName]
          properties:
            id: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            dni: { type: string, nullable: true }
        requesterType: { $ref: "#/components/schemas/HcCopyRequesterType" }
        requesterName: { type: string }
        status: { $ref: "#/components/schemas/HcCopyStatus" }
        requestedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean }
